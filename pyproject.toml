# Wave 0: the interface freeze. `pydantic` is load-bearing for CONTRACTS.md and pinned;
# everything downstream of a backbone choice (judges/probes/distil) is still unresolved on
# purpose -- pinning those before the survey fixes the backbone would be a guess presented
# as a decision.
[project]
name = "vernier"
version = "0.0.0"
description = "Putting error bars on a dataset vendor's quality claim, and distilling the judge into an instrument anyone can re-run."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# probes  -- frozen-feature backbones for the transfer probe
# distil  -- LoRA training path for the open instrument
# space   -- the demo
judges = [
    # Qwen3-VL-8B-Instruct-FP8 (docs/DECISIONS.md D042), self-hosted via vLLM's
    # OpenAI-compatible server mode (Modal, then AWS) -- the `openai` client works against any
    # OpenAI-compatible endpoint via `base_url`, so no vLLM- or Modal-specific SDK is needed
    # here. Gemini/Claude (google-genai/anthropic) are retired per D042.
    # Pinned below 3: openai 3.x swapped `httpx` for a vendored `httpx2`, which breaks the
    # real-exception-type tests in tests/test_judges_qwen3vl.py under mypy (caught by CI, not
    # locally -- every real judge call in data/ ran on 2.x). Lifting the pin is a real re-run.
    "openai>=1.0,<3",
]
data = [
    "pyarrow>=17",
    # sampling/draw.py's real `_candidate_frames` wiring for the E10k-* evaluation-release arms
    # (docs/DECISIONS.md D043's follow-on): huggingface_hub.hf_hub_download pulls each pinned
    # parquet locally once (never streamed row-by-row over `hf://` -- verified live this session
    # that a single-row remote read against a ~1.8GB file is unworkably slow), pillow decodes
    # each frame's real width/height (FrameRef requires both; the parquet carries neither).
    "huggingface_hub>=0.35",
    "pillow>=10",
]
stats = [
    "numpy>=1.26",
    "scipy>=1.11",
]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]
probes = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
    # docs/DECISIONS.md D064: LinearProbe.save/load persist the fitted model so a training run
    # is a real, loadable artifact, not just a metrics JSON. joblib was already available
    # transitively via scikit-learn; pinned explicitly now that the artifact's reproducibility
    # depends on it directly.
    "joblib>=1.3",
    # docs/DECISIONS.md D063: cascade.py's Wilson-score lower bound needs scipy.stats.norm for
    # its z-quantile -- already a real project dependency via estimation/ppi.py's own two-sided
    # z, pinned again here since distil/cascade.py can be exercised without the `stats` extra.
    "scipy>=1.11",
    # docs/DECISIONS.md D034's pinned frozen backbone (facebook/dinov3-vits16-pretrain-
    # lvd1689m). Blocked as of D051: this account is not authorized for the gated checkpoint --
    # declared here anyway since it's the real, already-decided dependency, not a new one.
    "torch>=2.0",
    "transformers>=4.40",
    # docs/DECISIONS.md D061: facebook/dinov2-small (ungated substitute for the blocked DINOv3
    # pin). `scripts/distill_rung1.py` reproduces `AutoImageProcessor`'s real preprocessing
    # manually with pillow, deliberately NOT depending on `torchvision` -- this environment's
    # Python cannot import it (`No module named '_lzma'`, a real build-time gap, not a missing
    # package), and worse, `transformers` only attempts the broken import *because* torchvision
    # is present on the path; leaving it uninstalled makes `transformers` correctly detect its
    # absence and skip the torchvision-dependent codepath entirely. Found only by actually
    # running the pipeline both ways, not assumed.
    "pillow>=10.0",
]
cloud = [
    # cloud/modal_qwen3vl.py -- serving Qwen3-VL-8B-Instruct-FP8 on Modal (docs/DECISIONS.md
    # D042). AWS, the credits-exhausted fallback, needs no new Python dependency here -- it's
    # a different deployment target for the same vLLM server, not a different client library.
    "modal>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vernier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["vernier"]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib"]
ignore_missing_imports = true

