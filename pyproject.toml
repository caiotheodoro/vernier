# Skeleton. Dependencies are named, not resolved: no code exists yet, and pinning
# versions before the survey fixes the backbone would be a guess presented as a decision.
[project]
name = "vernier"
version = "0.0.0"
description = "Putting error bars on a dataset vendor's quality claim, and distilling the judge into an instrument anyone can re-run."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# judges  -- the panel: one closed replication target, one second frontier judge, one open model
# probes  -- frozen-feature backbones for the transfer probe
# distil  -- LoRA training path for the open instrument
# space   -- the demo
# dev     -- tests, lint

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vernier"]
